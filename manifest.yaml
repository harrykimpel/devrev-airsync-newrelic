version: "2"
name: New Relic
description: Import New Relic alert issues into DevRev with AirSync

service_account:
  display_name: New Relic Bot
  scopes:
    self:
      - scope: sync_mapper_record:write
        optional: false
        reason: Maintain sync mapper records
      - scope: sync_mapper_record:read
        optional: false
        reason: Read sync mapper records
      - scope: sync_unit:read
        optional: false
        reason: Read sync units
      - scope: sync_snap_in:all
        optional: false
        reason: Run AirSync
      - scope: sync_history:read
        optional: false
        reason: Read sync history
      - scope: issue:read
        optional: true
        reason: Create and complete bot-owned internal analysis comments after an authorized user requests telemetry analysis
    impersonate:
      - act_as: all_devusers
        scopes:
          - scope: issue:read
            optional: true
            reason: Read the selected issue and post its internal New Relic context snapshot as the requesting user

functions:
  - name: extraction
    description: Extract New Relic accounts and alert issues
  - name: fetch_newrelic_context
    description: Analyze New Relic incidents, post evidence and coordinate GitHub fixes
  - name: initialize_newrelic_context
    description: Initialize the New Relic context issue component
  - name: complete_newrelic_analysis
    description: Complete an internal analysis, GitHub, coding or combined triage result when a DevRev agent responds

inputs:
  organization:
    - name: acknowledge_on_triage
      description: Acknowledge the source New Relic issue when Triage and start fix is clicked. Uses the clicking user's existing New Relic connection; acknowledgment failures do not stop triage.
      field_type: bool
      is_required: false
      default_value: false
      ui:
        display_name: Acknowledge in New Relic when triage starts
    - name: analysis_agent_id
      description: Full DON of a published internal DevRev agent in this organization. Used by both analysis buttons.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: Incident analysis agent ID
    - name: github_issue_agent_id
      description: Full DON of a published internal agent with GitHub MCP skills. Used by Create GitHub issue and Triage and start fix; the combined action also needs Copilot assignment and PR read skills.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: GitHub issue agent ID
    - name: github_issue_repository
      description: Target repository as owner/repository. Match the repository allowed by the GitHub agent and its MCP connection.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: GitHub issue repository
    - name: coding_agent_id
      description: Optional full DON of a published coding coordinator agent. Empty reuses GitHub issue agent ID. Publish the coding workflow instructions before use.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: Coding agent ID
    - name: coding_agent_provider
      description: Coding provider adapter. This release supports copilot; other providers require an adapter.
      field_type: text
      is_required: false
      default_value: copilot
      ui:
        display_name: Coding agent provider
    - name: coding_agent_base_branch
      description: Optional existing GitHub branch for Copilot to start from. Empty uses the repository default branch.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: Coding agent base branch

event_sources:
  organization:
    - name: newrelic-agent-responses
      display_name: New Relic analyst responses
      description: Receives asynchronous DevRev agent results for internal issue analysis
      type: devrev-webhook
      config:
        event_types:
          - ai_agent_response

automations:
  - name: complete-newrelic-analysis
    source: newrelic-agent-responses
    event_types:
      - ai_agent_response
    function: complete_newrelic_analysis

keyrings:
  user:
    - name: newrelic_context
      display_name: New Relic context connection
      description: Your New Relic user key with query access to the source alert account; acknowledgment also requires permission to manage alert issues. Select the matching regional connection.
      types:
        - newrelic-user-key

snap_kit_actions:
  - name: fetch_newrelic_context
    description: Investigate a New Relic incident and coordinate a proposed fix through GitHub
    function: fetch_newrelic_context

snap_components:
  - name: newrelic_context
    display_name: New Relic incident triage
    description: Investigate this alert, analyze recent telemetry, and coordinate a fix through GitHub
    surface: issue
    snap_kit_action_name: fetch_newrelic_context
    initializer: initialize_newrelic_context
    snap_kit_body:
      snaps:
        - type: card
          title:
            type: plain_text
            text: New Relic incident triage
          elements:
            - type: content
              elements:
                - type: plain_text
                  text: Investigate this alert, analyze recent telemetry, and coordinate a fix through GitHub. Triage and start fix runs all three steps; it also acknowledges the source alert when enabled in snap-in settings. The brief and verified links appear in the internal discussion.
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  style: primary
                  value: triage
                  text:
                    type: plain_text
                    text: Triage and start fix
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: alert
                  text:
                    type: plain_text
                    text: Analyze incident
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: recent
                  text:
                    type: plain_text
                    text: Analyze latest 30 minutes
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: evidence
                  text:
                    type: plain_text
                    text: Fetch alert evidence
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: recent_evidence
                  text:
                    type: plain_text
                    text: Fetch latest evidence
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: github
                  text:
                    type: plain_text
                    text: Create GitHub issue
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: coding
                  text:
                    type: plain_text
                    text: Start coding agent
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: coding_status
                  text:
                    type: plain_text
                    text: Check coding progress
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: acknowledge
                  text:
                    type: plain_text
                    text: Acknowledge in New Relic

keyring_types:
  - id: newrelic-user-key
    name: New Relic Connection
    description: 'Use a user API key and subdomain api (US) or api.eu (EU).'
    external_system_name: New Relic
    kind: Secret
    is_subdomain: true
    secret_config:
      secret_transform: ".token"
      fields:
        - id: token
          name: User API key
          description: New Relic user API key (not an ingest/license key)
      token_verification:
        url: "https://[SUBDOMAIN].newrelic.com/v2/applications.json"
        method: GET
        headers:
          Api-Key: "[API_KEY]"

imports:
  - slug: airdrop-newrelic-snap-in
    display_name: New Relic
    description: Import alert issues from a New Relic account
    extractor_function: extraction
    allowed_connection_types:
      - newrelic-user-key
