version: "2"
name: New Relic
description: Import New Relic alert issues into DevRev with AirSync

service_account:
  display_name: New Relic Bot
  scopes:
    self:
      - scope: sync_mapper_record:write
        optional: false
        reason: Maintain sync mapper records
      - scope: sync_mapper_record:read
        optional: false
        reason: Read sync mapper records
      - scope: sync_unit:read
        optional: false
        reason: Read sync units
      - scope: sync_snap_in:all
        optional: false
        reason: Run AirSync
      - scope: sync_history:read
        optional: false
        reason: Read sync history
      - scope: issue:read
        optional: true
        reason: Create and complete bot-owned internal analysis comments after an authorized user requests telemetry analysis
    impersonate:
      - act_as: all_devusers
        scopes:
          - scope: issue:read
            optional: true
            reason: Read the selected issue and post its internal New Relic context snapshot as the requesting user

functions:
  - name: extraction
    description: Extract New Relic accounts and alert issues
  - name: fetch_newrelic_context
    description: Fetch bounded New Relic telemetry and request DevRev incident analysis or post evidence
  - name: initialize_newrelic_context
    description: Initialize the New Relic context issue component
  - name: complete_newrelic_analysis
    description: Complete an internal analysis comment when the DevRev agent responds

inputs:
  organization:
    - name: analysis_agent_id
      description: Full DON of a published internal DevRev agent in this organization. Used by both analysis buttons.
      field_type: text
      is_required: false
      default_value: ""
      ui:
        display_name: Incident analysis agent ID

event_sources:
  organization:
    - name: newrelic-agent-responses
      display_name: New Relic analyst responses
      description: Receives asynchronous DevRev agent results for internal issue analysis
      type: devrev-webhook
      config:
        event_types:
          - ai_agent_response

automations:
  - name: complete-newrelic-analysis
    source: newrelic-agent-responses
    event_types:
      - ai_agent_response
    function: complete_newrelic_analysis

keyrings:
  user:
    - name: newrelic_context
      display_name: New Relic context connection
      description: Your New Relic user key with query access to the source alert account; select the matching regional connection.
      types:
        - newrelic-user-key

snap_kit_actions:
  - name: fetch_newrelic_context
    description: Analyze New Relic telemetry or fetch evidence into an internal issue comment
    function: fetch_newrelic_context

snap_components:
  - name: newrelic_context
    display_name: New Relic context
    description: Fetch metrics, error logs and trace samples for this New Relic issue
    surface: issue
    snap_kit_action_name: fetch_newrelic_context
    initializer: initialize_newrelic_context
    snap_kit_body:
      snaps:
        - type: card
          title:
            type: plain_text
            text: New Relic context
          elements:
            - type: content
              elements:
                - type: plain_text
                  text: Analyze the alert window and latest 30 minutes with the incident analyst. The summary appears in the internal discussion. Evidence buttons post the bounded query results separately.
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  style: primary
                  value: alert
                  text:
                    type: plain_text
                    text: Analyze New Relic context
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: recent
                  text:
                    type: plain_text
                    text: Analyze latest 30 minutes
            - type: actions
              direction: row
              elements:
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: evidence
                  text:
                    type: plain_text
                    text: Fetch alert evidence
                - type: button
                  action_id: fetch_newrelic_context
                  action_type: remote
                  value: recent_evidence
                  text:
                    type: plain_text
                    text: Fetch latest evidence

keyring_types:
  - id: newrelic-user-key
    name: New Relic Connection
    description: 'Use a user API key and subdomain api (US) or api.eu (EU).'
    external_system_name: New Relic
    kind: Secret
    is_subdomain: true
    secret_config:
      secret_transform: ".token"
      fields:
        - id: token
          name: User API key
          description: New Relic user API key (not an ingest/license key)
      token_verification:
        url: "https://[SUBDOMAIN].newrelic.com/v2/applications.json"
        method: GET
        headers:
          Api-Key: "[API_KEY]"

imports:
  - slug: airdrop-newrelic-snap-in
    display_name: New Relic
    description: Import alert issues from a New Relic account
    extractor_function: extraction
    allowed_connection_types:
      - newrelic-user-key
